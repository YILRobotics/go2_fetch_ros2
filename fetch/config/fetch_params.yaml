cube_tracker_node:
  ros__parameters:
    # Input topics from RealSense.
    image_topic: /camera/aligned_depth_to_color/image_raw
    pointcloud_topic: /camera/depth/color/points

    # Output topics from the tracker.
    cube_state_topic: /go2_fetch/cube_state
    cube_visible_topic: /go2_fetch/cube_visible
    debug_image_topic: /go2_fetch/cube_debug_image
    mask_image_topic: /go2_fetch/cube_mask_image
    pre_yolo_image_topic: /go2_fetch/cube_pre_yolo_image

    # YOLO model path.
    # model_path: /home/ferdinand/unitree/go2_fetch_ros2/fetch/models/yoloe-26l-seg.pt
    model_path: /home/ferdinand/unitree/go2_fetch_ros2/fetch/models/yoloe-26l-seg_ball_round_object_sphere_round.onnx
    # Minimum confidence for a YOLO candidate.
    conf_threshold: 0.1

    # Tracker throughput cap (timer frequency in Hz).
    processing_rate_hz: 25.0
    # Intermediate pipeline log throttle (set 0 to disable extra stage logs).
    pipeline_log_rate_hz: 5.0

    # Optional HSV pre-mask before YOLO (keeps green/blue regions only).
    enable_hsv_pre_mask: true
    # Publish the exact image sent to YOLO after optional HSV masking.
    publish_pre_yolo_image: true
    # HSV bounds for green and blue masks: [H, S, V] in OpenCV ranges.
    hsv_green_lower: [35, 40, 40]
    hsv_green_upper: [90, 255, 255]
    hsv_blue_lower: [90, 40, 40]
    hsv_blue_upper: [135, 255, 255]


    # Max sampled mask pixels used for point cloud centroiding.
    max_mask_samples: 500
    # Minimum valid 3D points required after filtering.
    min_inlier_points: 10
    # Accepted depth range in meters.
    min_depth_m: 0.1
    max_depth_m: 5.0
    # Outlier rejection aggressiveness (median absolute deviation scale).
    outlier_mad_scale: 3.0
    # How long detection stays visible after last valid 3D update.
    detection_timeout_s: 0.35
    # Time window used for velocity fitting.
    velocity_window_s: 0.6

    # Target frame for published state and TF lookup timeout.
    target_frame: base_link
    tf_timeout_s: 0.05

    # Visualization outputs.
    publish_debug_image: true
    publish_mask_image: true

policy_node:
  ros__parameters:
    # IO topics.
    mode_topic: /go2_fetch/mode
    lowstate_topic: /lowstate
    lowcmd_topic: /lowcmd
    robot_odom_topic: /lio_sam_ros2/mapping/odometry
    cube_state_topic: /go2_fetch/cube_state

    # Control loop rates.
    control_rate_hz: 50.0
    high_level_rate_hz: 15.0
    standup_duration_s: 3.0
    search_spin_rate: 0.30

    # Policy checkpoints and runtime backend.
    high_level_policy_path: /home/ferdinand/fetchrobot/ferdinand/go2_fetch_rl/logs/rsl_rl/unitree_go2_pushcube_4l/2026-04-05_21-11-33_test_77/model_2399.pt
    low_level_policy_path: /home/ferdinand/fetchrobot/ferdinand/go2_fetch_rl/logs/rsl_rl/unitree_go2_velocity_4l/2026-04-05_12-01-56_walk_2/exported/policy.pt
    torch_device: gpu

    # Low-level action scaling and motor gains.
    action_scale: 0.25
    kp: 40.0
    kd: 0.5
    tau_ff: 0.0

    # Motion command limits.
    max_lin_x: 0.5
    max_lin_y: 0.5
    max_yaw: 0.25

    # Goal and foot-target geometry.
    goal_xy: [0.0, 0.0]
    goal_radius: 0.2
    lf_foot_xy_offset: [0.22, 0.10]

    # Joint defaults and policy-to-motor index mapping.
    default_joint_angles: [0.1, -0.1, 0.1, -0.1, 0.8, 0.8, 1.0, 1.0, -1.5, -1.5, -1.5, -1.5]
    policy_to_motor_map: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]

state_machine_node:
  ros__parameters:
    # IO topics.
    cube_visible_topic: /go2_fetch/cube_visible
    mode_topic: /go2_fetch/mode
    state_topic: /go2_fetch/state
    tracking_lost_topic: /go2_fetch/cube_tracking_lost

    # State machine timing.
    tick_rate_hz: 10.0
    standup_duration_s: 3.0
    cube_lost_timeout_s: 0.5
    cube_reacquire_hold_s: 0.25
