cube_tracker_node:
  ros__parameters:
    # Input topics from RealSense.
    image_topic: /camera/aligned_depth_to_color/image_raw
    pointcloud_topic: /camera/depth/color/points

    # Output topics from the tracker.
    cube_state_topic: /go2_fetch/cube_state
    cube_visible_topic: /go2_fetch/cube_visible
    cube_marker_topic: /go2_fetch/cube_marker
    debug_image_topic: /go2_fetch/cube_debug_image
    mask_image_topic: /go2_fetch/cube_mask_image
    pre_yolo_image_topic: /go2_fetch/cube_pre_yolo_image

    # YOLO model path.
    model_path: /home/ferdinand/unitree/src/go2_fetch_ros2/fetch/models/yoloe-26l-seg_box.onnx
    # model_path: /weak_motorhome/ferdinand/unitree/go2_fetch_ros2/fetch/models/yoloe-26l-seg_ball_round_object_sphere_round.onnx
    # Minimum confidence for a YOLO candidate.
    conf_threshold: 0.1

    # Tracker throughput cap (timer frequency in Hz).
    processing_rate_hz: 25.0
    # Intermediate pipeline log throttle (set 0 to disable extra stage logs).
    pipeline_log_rate_hz: 5.0

    # Optional HSV pre-mask before YOLO (keeps green/blue regions only).
    enable_hsv_pre_mask: false
    # Publish the exact image sent to YOLO after optional HSV masking.
    publish_pre_yolo_image: true
    # HSV bounds for green and blue masks: [H, S, V] in OpenCV ranges.
    hsv_green_lower: [35, 40, 40]
    hsv_green_upper: [90, 255, 255]
    hsv_blue_lower: [90, 40, 40]
    hsv_blue_upper: [135, 255, 255]


    # Max sampled mask pixels used for point cloud centroiding.
    max_mask_samples: 500
    # Minimum valid 3D points required after filtering.
    min_inlier_points: 10
    # Accepted depth range in meters.
    min_depth_m: 0.1
    max_depth_m: 5.0
    # Outlier rejection aggressiveness (median absolute deviation scale).
    outlier_mad_scale: 3.0
    # How long detection stays visible after last valid 3D update.
    detection_timeout_s: 0.5
    # Time window used for velocity fitting.
    velocity_window_s: 0.6
    # First-order low-pass cutoff for published cube XYZ state; <= 0 disables it.
    cube_state_low_pass_cutoff_hz: 4.0
    # Physical RViz marker dimensions [x, y, z] in meters.
    cube_dimensions: [0.16, 0.16, 0.16]

    # Target frame for published state and TF lookup timeout.
    target_frame: camera_link
    tf_timeout_s: 0.05

    # Visualization outputs.
    publish_debug_image: true
    publish_mask_image: true

policy_node:
  ros__parameters:
    # DDS / Unitree SDK setup. Set network_interface to the robot NIC, for example eth0.
    network_interface: ""
    dds_domain_id: 0
    project_root: /home/ferdinand/unitree/Deploy_SimToReal_RL_Go2
    unitree_sdk_paths: []

    # When true, generate random observations, skip DDS setup, and never send commands.
    fake_observations_mode: true
    # Independent output gate. Fake observation mode always overrides this to false.
    send_commands: false
    fake_observation_seed: 0
    fake_observation_min: -1.0
    fake_observation_max: 1.0
    fake_log_every_n_steps: 100
    
    # Runtime behavior copied from deploy_real_isaaclab.py.
    start_policy_on_startup: true
    auto_switch_to_low_level: true
    wait_for_start_button: true
    wait_for_a_button: true
    plot_on_exit: false
    analysis_pdf_path: analyse_robot.pdf
    model_loop_period_s: 0.025
    startup_sleep_s: 0.001

    # ROS bridge topics used by the Kalman/inekf helper.
    kalman_odom_topic: /odometry/filtered
    inekf_lowstate_topic: /inekf_lowstate
    lowstate_publish_period_s: 0.005

    # Original deploy_real/configs/go2.yaml values.
    msg_type: go
    imu_type: pelvis
    lowcmd_topic: rt/lowcmd
    lowstate_topic: rt/lowstate
    sportstate_topic: rt/sportmodestate
    policy_path: policy_rough.pt
    policy_base_dir: /home/ferdinand/unitree/Deploy_SimToReal_RL_Go2/pre_train
    leg_joint2motor_idx: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]
    default_angles: [-0.1, 0.8, -1.5, 0.1, 0.8, -1.5, -0.1, 1.0, -1.5, 0.1, 1.0, -1.5]
    kps: [25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0]
    kds: [5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0, 5.0]
    weak_motor: []
    arm_waist_joint2motor_idx: []
    arm_waist_kps: []
    arm_waist_kds: []
    arm_waist_target: []
    control_dt: 0.005
    ang_vel_scale: 0.25
    dof_pos_scale: 1.0
    dof_vel_scale: 0.05
    action_scale: 0.25
    cmd_scale: [0.8, 0.8, 1.0]
    num_actions: 12
    num_obs: 52
    max_cmd: [1.0, 1.0, 1.0]

state_machine_node:
  ros__parameters:
    # IO topics.
    cube_visible_topic: /go2_fetch/cube_visible
    mode_topic: /go2_fetch/mode
    state_topic: /go2_fetch/state
    tracking_lost_topic: /go2_fetch/cube_tracking_lost

    # State machine timing.
    tick_rate_hz: 10.0
    standup_duration_s: 3.0
    cube_lost_timeout_s: 0.5
    cube_reacquire_hold_s: 0.25
