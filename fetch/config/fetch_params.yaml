cube_tracker_yolo_node:
  ros__parameters:
    # --- Input and output topics ---
    image_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/color/camera_info
    measurement_topic: /go2_fetch/yolo/cube_measurement
    measurement_variance_xy: 0.0025
    debug_image_topic: /go2_fetch/cube_debug_image/compressed
    mask_image_topic: /go2_fetch/cube_mask_image/compressed
    pre_yolo_image_topic: /go2_fetch/cube_pre_yolo_image

    # --- Detector model ---
    # Open-vocabulary classes are applied to compatible YOLOE .pt models.
    # Exported ONNX/TensorRT models normally have their classes baked in.
    model_path: /home/ferdinand/unitree/src/go2_fetch_ros2/fetch/models/yolo/yoloe-26s-seg_box_pc.engine
    conf_threshold: 0.1
    yolo_classes: ["box"]
    inference_width: 640
    inference_height: 360
    # D435 depth units are millimetres unless changed in the device configuration.
    depth_scale_m: 0.001

    # --- Processing and diagnostics ---
    processing_rate_hz: 8.0
    status_log_rate_hz: 2.0
    pipeline_log_rate_hz: 2.0
    enable_timing_log: true
    timing_log_rate_hz: 5.0
    # Exit after a stuck native/TensorRT inference so launch can restart the process.
    inference_timeout_s: 5.0
    input_stall_warn_s: 2.0

    # --- Image and mask preprocessing ---
    enable_hsv_pre_mask: false
    publish_pre_yolo_image: false
    # HSV values use OpenCV ranges: H=[0, 179], S/V=[0, 255].
    hsv_green_lower: [35, 40, 40]
    hsv_green_upper: [90, 255, 255]
    hsv_blue_lower: [90, 40, 40]
    hsv_blue_upper: [135, 255, 255]
    mask_erode_iterations: 1
    mask_erode_kernel_size: 5
    central_mask_keep_ratio: 0.3

    # --- Aligned-depth extraction and filtering ---
    max_mask_samples: 200
    min_inlier_points: 10
    min_depth_m: 0.1
    max_depth_m: 5.0
    outlier_mad_scale: 3.0

    # --- Tracking and smoothing ---
    detection_timeout_s: 0.5
    velocity_window_s: 0.6
    # Values <= 0 disable low-pass filtering.
    cube_state_low_pass_cutoff_hz: 5.0
    max_pose_jump_m: 0.30
    max_pose_speed_mps: 1.0

    # --- Coordinate frame and cube geometry ---
    target_frame: odom
    tf_timeout_s: 0.05
    camera_info_max_age_s: 5.0
    camera_info_stamp_tolerance_s: 1.0
    camera_info_aspect_tolerance: 0.02
    cube_dimensions: [0.16, 0.16, 0.16]
    cube_position_offset_xyz: [0.0, 0.0, 0.0]

    # --- Debug visualization ---
    publish_debug_image: true
    publish_mask_image: false

cube_tracker_pcl_node:
  ros__parameters:
    # --- Inputs, diagnostics, and final fused outputs ---
    pointcloud_topic: /camera/depth/color/points
    yolo_measurement_topic: /go2_fetch/yolo/cube_measurement
    pcl_measurement_topic: /go2_fetch/pcl/cube_measurement
    tracked_points_topic: /go2_fetch/pcl/tracked_points
    cube_state_topic: /go2_fetch/cube_state
    cube_visible_topic: /go2_fetch/cube_visible
    cube_marker_topic: /go2_fetch/cube_marker
    # Use a fixed world frame so robot motion is not interpreted as cube velocity.
    target_frame: odom
    # Maximum cloud callback rate. Frames above this rate are skipped, not queued.
    processing_rate_hz: 30.0
    # Periodic PCL pipeline status messages; set to 0 only if diagnostics are unwanted.
    status_log_rate_hz: 2.0

    # --- Cloud preprocessing and floor removal ---
    # Points outside this distance from the camera are discarded before clustering.
    min_range_m: 0.12
    max_range_m: 4.0
    # PCL voxel side length. Larger values reduce CPU use but remove cube detail.
    voxel_leaf_m: 0.012
    # Maximum point-to-plane distance for a point to be classified as floor.
    floor_distance_threshold_m: 0.018
    # The RANSAC floor normal must be within this angle of the odom Z axis.
    floor_max_tilt_deg: 15.0
    # RANSAC trials per cloud. Raise this if floor removal is unreliable; lower it
    # if floor fitting dominates the 33 ms processing budget at 30 Hz.
    floor_max_iterations: 60

    # --- Euclidean clustering and cube-shape gates ---
    # Maximum 3D distance between neighboring points belonging to one cluster.
    cluster_tolerance_m: 0.035
    # Smaller clusters are discarded immediately. Clusters between this and
    # cluster_min_points are retained only as possible leg-occluded fragments.
    fragment_min_points: 20
    # Minimum points required by either a normal cube cluster or merged fragments.
    cluster_min_points: 55
    cluster_max_points: 12000
    cube_dimensions: [0.16, 0.16, 0.16]
    # Reject candidates whose measured bounding extent is implausibly small/large.
    # The smaller threshold applies to horizontal extent; Z uses half of it.
    cube_dimension_min_m: 0.045
    cube_dimension_max_m: 0.28
    # A normal or merged candidate must span at least this fraction of the known
    # cube width. This prevents a small visible corner from updating the filter.
    merged_min_visible_fraction: 0.5
    # Fragments can be merged only when their camera ranges differ by less than this.
    fragment_depth_tolerance_m: 0.10
    # Once initialized, reject clusters farther than this from the predicted XY.
    association_gate_m: 0.35

    # --- Front-leg removal and occlusion merging ---
    # Frames are groups of [thigh, calf, foot], one group per leg. Capsules are
    # constructed between thigh-calf and calf-foot TF origins at the cloud stamp.
    leg_frames: [FL_thigh, FL_calf, FL_foot, FR_thigh, FR_calf, FR_foot]
    # Points within this radius of a leg capsule are removed as robot self-points.
    leg_exclusion_radius_m: 0.065
    # Two fragments may be joined only if their connecting line passes this close
    # to a removed leg, indicating that the leg plausibly caused the split.
    leg_merge_gap_radius_m: 0.11

    # --- Constant-velocity EKF and delayed YOLO replay ---
    # Standard deviation of unmodelled planar cube acceleration. Higher values
    # let the filter change velocity faster but produce a less smooth estimate.
    process_accel_std_mps2: 1.0
    # XY position variances in m^2. Lower values trust that source more strongly.
    pcl_measurement_variance_xy: 0.0064
    yolo_measurement_variance_xy: 0.0035
    # Squared Mahalanobis innovation limits. 9.21 and 13.82 approximately match
    # 99% and 99.9% gates for a two-dimensional position observation.
    pcl_innovation_gate: 9.21
    yolo_innovation_gate: 13.82
    # State/measurement history retained for rewinding and replaying delayed YOLO.
    # YOLO results older than this window are rejected.
    history_duration_s: 0.5
    # Publish cube_visible=false after neither source has passed its gates this long.
    detection_timeout_s: 0.5


high_level_policy_node:
  ros__parameters:
    # --- Startup, operating mode, and command gates ---
    start_policy_on_startup: true
    # Options: hierarchical_lowcmd or unitree_sport_high_level.
    control_mode: hierarchical_lowcmd
    # Fake observation mode always prevents command output.
    send_commands: true
    use_high_level_policy: true

    # --- Remote controls ---
    high_level_toggle_button: "X"
    goal_set_button: "Y"
    cube_recovery_toggle_button: "B"
    # Remote mapping is [forward (LY), lateral (-LX), yaw (-RX)].
    joystick_command_scale: [1.0, 1.0, 1.0]

    # --- Goal definition and completion condition ---
    goal_xy: [2.0, 0.0] # same as training
    # Included in the trained high-level policy observation.
    goal_radius: 0.15
    # Completion requires the cube to remain within this radius for the hold
    # time while the robot base is outside robot_goal_clear_radius.
    cube_goal_stop_radius: 0.15
    cube_goal_hold_s: 1.0
    robot_goal_clear_radius: 0.3

    # --- Cube-loss recovery rotation ---
    cube_state_timeout_s: 0.8
    # Smoothly reduce the locomotion command after cube tracking becomes stale.
    cube_stale_stop_ramp_s: 1.0
    # Fixed normalized yaw command, limited by max_cmd yaw.
    cube_recovery_angular_cmd: 0.7
    cube_recovery_front_angle_deg: 10.0
    cube_recovery_max_rotation_deg: 360.0

    # --- Fake observation modes ---
    fake_observations_mode: false
    fake_observation_seed: 0
    fake_observation_min: -1.0
    fake_observation_max: 1.0
    fake_log_every_n_steps: 100
    fake_cube_observation_mode: false
    fake_cube_position_xy: [0.3, 0.0]
    fake_cube_velocity_xy: [0.0, 0.0]
    fake_cube_publish_period_s: 0.05

    # --- ROS topics and coordinate frames ---
    kalman_odom_topic: /go2_odometry/filtered
    cube_state_topic: /go2_fetch/cube_state
    lowstate_topic: /lowstate
    sport_request_topic: /api/sport/request
    policy_world_frame: odom
    lf_foot_frame: FL_foot
    lf_foot_tf_timeout_s: 0.02
    cube_state_tf_timeout_s: 0.05
    # nav_msgs/Odometry twist is normally expressed in child_frame_id.
    robot_twist_in_body_frame: true

    # --- RViz visualization ---
    cube_marker_topic: /go2_fetch/cube_marker
    cube_dimensions: [0.16, 0.16, 0.16]
    goal_marker_topic: /go2_fetch/goal_marker
    goal_marker_publish_period_s: 0.2
    command_velocity_marker_topic: /go2_fetch/command_velocity_marker
    current_velocity_marker_topic: /go2_fetch/current_velocity_marker
    command_velocity_marker_frame: base
    command_velocity_marker_z_offset: 0.25
    command_velocity_marker_scale: 0.25
    velocity_marker_rate_hz: 15.0

    # --- Policy models and inference rates ---
    high_level_policy_path: /home/unitree/fetch_ws/src/go2_fetch_ros2/fetch/models/unitree_go2_pushcube_4l/2026-06-30_13-49-47_ff_5_1/policy.engine
    high_level_rate_hz: 15.0
    high_level_num_obs: 52

    # --- Unitree Sport high-level control ---
    sport_move_publish_rate_hz: 15.0
    sport_stop_on_disable: true
    sport_command_log_every_n_steps: 50
    # Maps trained commands to Unitree Sport Move [x, y, yaw].
    sport_command_scale: [-1.0, 1.0, 1.0]

    # --- High-level observation fields and command limits ---
    # Per-sensor force readings measured while no foot is touching the ground.
    # Order of real robot is: [FR, FL, RR, RL]. Order in Simulation is: [FL, FR, RL, RR]. Reordering added
    foot_force_offset: [4.0, 1.0, 5.0, 5.0]
    # Clamp offset-corrected raw readings to match the Isaac Lab observation.
    foot_force_clip_max: 150.0
    # Divisor used to normalize the four LowState foot-force readings.
    foot_force_scale: 80.0
    num_actions: 12
    max_cmd: [0.6, 0.5, 0.8] ###
    # max_cmd: [1.0, 0.8, 1.0] ### max for hihg level

    # --- Joint-state fields used by the high-level observation ---
    leg_joint2motor_idx: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]
    default_angles: [0.1, -0.1, 0.1, -0.1, 0.8, 0.8, 1.0, 1.0, -1.5, -1.5, -1.5, -1.5]
    # --- Diagnostics and analysis output ---
    high_level_command_log_period_s: 1.0
    plot_on_exit: false
    analysis_pdf_path: /home/unitree/fetch_ws/src/go2_fetch_ros2/fetch/plots/analysis.png


low_level_policy_node:
  ros__parameters:
    control_mode: hierarchical_lowcmd
    send_commands: true
