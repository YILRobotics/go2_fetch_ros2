cube_tracker_node:
  ros__parameters:
    image_topic: /camera/color/image_raw
    pointcloud_topic: /camera/depth/color/points
    cube_state_topic: /go2_fetch/cube_state
    cube_visible_topic: /go2_fetch/cube_visible
    debug_image_topic: /go2_fetch/cube_debug_image

    model_path: yoloe-26l-seg.pt
    target_classes: [cube, box, black cube, bottle]
    conf_threshold: 0.15

    processing_rate_hz: 20.0
    max_mask_samples: 2500
    min_inlier_points: 30
    min_depth_m: 0.15
    max_depth_m: 5.0
    outlier_mad_scale: 3.0
    detection_timeout_s: 0.35
    velocity_window_s: 0.6

    target_frame: base_link
    tf_timeout_s: 0.05
    publish_debug_image: false

policy_node:
  ros__parameters:
    mode_topic: /go2_fetch/mode
    lowstate_topic: /lowstate
    lowcmd_topic: /lowcmd
    robot_odom_topic: /lio_sam_ros2/mapping/odometry
    cube_state_topic: /go2_fetch/cube_state

    control_rate_hz: 50.0
    high_level_rate_hz: 15.0
    standup_duration_s: 3.0
    search_spin_rate: 0.30

    high_level_policy_path: /home/ferdinand/fetchrobot/ferdinand/go2_fetch_rl/logs/rsl_rl/unitree_go2_pushcube_4l/2026-04-05_21-11-33_test_77/model_2399.pt
    low_level_policy_path: /home/ferdinand/fetchrobot/ferdinand/go2_fetch_rl/logs/rsl_rl/unitree_go2_velocity_4l/2026-04-05_12-01-56_walk_2/exported/policy.pt
    torch_device: cpu

    action_scale: 0.25
    kp: 40.0
    kd: 0.5
    tau_ff: 0.0

    max_lin_x: 0.5
    max_lin_y: 0.5
    max_yaw: 0.25

    goal_xy: [0.0, 0.0]
    goal_radius: 0.2
    lf_foot_xy_offset: [0.22, 0.10]

    default_joint_angles: [0.1, -0.1, 0.1, -0.1, 0.8, 0.8, 1.0, 1.0, -1.5, -1.5, -1.5, -1.5]
    policy_to_motor_map: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]

state_machine_node:
  ros__parameters:
    cube_visible_topic: /go2_fetch/cube_visible
    mode_topic: /go2_fetch/mode
    state_topic: /go2_fetch/state
    tracking_lost_topic: /go2_fetch/cube_tracking_lost

    tick_rate_hz: 10.0
    standup_duration_s: 3.0
    cube_lost_timeout_s: 0.5
    cube_reacquire_hold_s: 0.25
