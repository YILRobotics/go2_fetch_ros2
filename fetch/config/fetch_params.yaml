    lowcmd_topic: /lowcmd
    lowstate_topic: /lowstate
    inekf_lowstate_topic: /go2_odometry/inekf_lowstate
    control_rate_hz: 50.0
    command_timeout_s: 0.25
    expected_inference_ms: 20.0
    inference_timeout_factor: 2.0
    max_consecutive_deadline_misses: 3
    ang_vel_scale: 0.2
    dof_pos_scale: 1.0
    dof_vel_scale: 0.05
    action_scale: 0.25
    max_cmd: [1.0, 1.0, 1.0]
    foot_force_offset: [4.0, 1.0, 5.0, 5.0]
    foot_force_clip_max: 150.0
    foot_force_scale: 75.0
    leg_joint2motor_idx: [3, 0, 9, 6, 4, 1, 10, 7, 5, 2, 11, 8]
    default_angles: [0.1, -0.1, 0.1, -0.1, 0.8, 0.8, 1.0, 1.0, -1.5, -1.5, -1.5, -1.5]
    kps: [25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0, 25.0]
    kds: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
    torque_limits: [22.0, 22.0, 20.0, 20.0, 22.0, 22.0, 20.0, 22.0, 22.0, 22.0, 20.0, 22.0]
